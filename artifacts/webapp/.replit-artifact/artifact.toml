kind = "web"
previewPath = "/webapp/"
title = "SmartHomeQ Web App"
version = "1.0.0"
id = "artifacts/webapp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/webapp/" ]
localPort = 19203

[services.development]
run = "pnpm --filter @workspace/webapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/webapp", "run", "build" ]
publicDir = "artifacts/webapp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19203"
BASE_PATH = "/webapp/"
